<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Значок СК — три правки</title><link rel="stylesheet" href="../viewer.css"><style>*{box-sizing:border-box}body{margin:0;background:#20262e;color:#eef0f3;font:16px system-ui}header{padding:20px 24px 8px;max-width:1550px;margin:auto}h1{margin:0 0 9px;font-size:25px}p{margin:0 0 8px;color:#c9d0da}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1550px;padding:15px 24px 28px;margin:auto}figure{margin:0}.views img{display:block;width:100%;max-height:calc(100vh - 190px);object-fit:contain}.views a{color:inherit;text-decoration:none}figcaption{text-align:center;margin:10px 0 18px}.whole{grid-column:1/-1}.whole img{max-height:750px}@media(max-width:700px){.views{grid-template-columns:1fr}.whole{grid-column:auto}}</style></head><body><header><h1>Значок СК — три правки</h1><p>Кулак немного уменьшен. Переход на лбу сглажен. Копьё входит в пасть без видимого острия.</p><p>Дракон и остальная композиция сохранены. Нажми на изображение для увеличения.</p></header><main class="views">

<figure class="whole"><a href="rider.png"><img src="rider.png" alt="Всадник и дракон после трёх правок"></a><figcaption>Композиция целиком</figcaption></figure>
<figure class="whole"><a href="front.png"><img src="front.png" alt="Общий вид значка спереди"></a><figcaption>Вид спереди</figcaption></figure>
<figure class="whole"><a href="angle.png"><img src="angle.png" alt="Общий вид значка под углом"></a><figcaption>Вид под углом</figcaption></figure></main><script src="../viewer.js"></script></body></html>
